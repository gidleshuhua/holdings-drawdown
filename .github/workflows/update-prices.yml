name: Update prices

on:
  schedule:
    # 06:40 UTC = 14:40 Taipei, Monday to Friday (after the 13:30 close)
    - cron: "40 6 * * 1-5"
  workflow_dispatch: {}
  push:
    paths:
      - holdings.json
      - fetch_prices.py

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download adjusted prices
        run: python fetch_prices.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi
